[project]
name = "alayout-cli"
version = "0.1.0"
description = "Inspect Android app layouts from the terminal"
requires-python = ">=3.10"
dependencies = ["textual>=1.0", "rich>=13", "typer>=0.12", "pillow>=10"]

[project.scripts]
alayout = "alayout.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alayout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
