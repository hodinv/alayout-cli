[project]
name = "alayout-cli"
dynamic = ["version", "readme"]
description = "Inspect Android app layouts (Views and Compose) from the terminal"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vasil Khodzin" }]
requires-python = ">=3.10"
keywords = ["android", "layout", "inspector", "compose", "adb", "uiautomator", "tui", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = ["textual>=1.0", "rich>=13", "typer>=0.12", "pillow>=10"]

[project.urls]
Homepage = "https://github.com/hodinv/alayout-cli"
Issues = "https://github.com/hodinv/alayout-cli/issues"
Changelog = "https://github.com/hodinv/alayout-cli/releases"

[project.scripts]
alayout = "alayout.cli:app"

[dependency-groups]
dev = ["pytest>=8"]
build = ["pyinstaller>=6"]

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/alayout/__init__.py"

# PyPI shows README.md; relative links (RELEASING.md, LICENSE) only work on GitHub,
# so they are rewritten to absolute GitHub URLs for the PyPI page.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/hodinv/alayout-cli/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/alayout"]

[tool.hatch.build.targets.sdist]
include = ["src/alayout", "tests", "scripts", "README.md", "LICENSE", "RELEASING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
